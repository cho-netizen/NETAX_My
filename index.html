<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my.netax.kr — 이음세무컨설팅</title>
<style>
  :root {
    --header-color: #3D5378;
    --gold: #C9A24B;
    --bg: #F5F6F8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 380px;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .card-header {
    background: linear-gradient(135deg, var(--header-color), #2c3e5c);
    border-left: 4px solid var(--gold);
    color: #fff;
    padding: 24px 20px;
  }
  .card-header h1 { margin: 0; font-size: 18px; }
  .card-header p { margin: 6px 0 0; font-size: 13px; opacity: 0.85; }
  .card-body { padding: 24px 20px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  button {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--header-color);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; text-align: center; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.info { color: #555; }
  .hint { font-size: 12px; color: #999; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h1>이음세무컨설팅 — my.netax.kr</h1>
      <p>열람번호로 자료 제출 및 보고서 확인</p>
    </div>
    <div class="card-body">
      <form id="loginForm">
        <label for="reportId">열람번호</label>
        <input id="reportId" maxlength="4" autocapitalize="characters" placeholder="예: A7YT" required>

        <label for="password" id="pwLabel">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호 입력" required>

        <button type="submit" id="submitBtn">확인</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msgEl = document.getElementById('msg');
    const pwLabel = document.getElementById('pwLabel');
    const submitBtn = document.getElementById('submitBtn');
    let isSetupMode = false;

    function showMsg(text, type) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (type ? ' ' + type : '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const reportId = document.getElementById('reportId').value.trim().toUpperCase();
      const password = document.getElementById('password').value;
      if (!reportId || !password) return;

      submitBtn.disabled = true;
      showMsg('확인 중입니다...', 'info');

      try {
        const passwordHash = await sha256Hex(password);
        const result = await callGas({ action: 'login', report_id: reportId, password_hash: passwordHash });

        if (result.needs_setup) {
          isSetupMode = true;
          pwLabel.textContent = '최초 접속입니다. 사용할 비밀번호를 설정해주세요';
          showMsg(result.customer_name + '님, 비밀번호를 설정해주세요.', 'info');
          document.getElementById('password').value = '';
          submitBtn.disabled = false;
          return;
        }
        if (!result.success) {
          showMsg(result.message || '오류가 발생했습니다.', 'error');
          submitBtn.disabled = false;
          return;
        }

        saveSession({
          report_id: reportId,
          password_hash: passwordHash,
          customer_name: result.customer_name,
          case_name: result.case_name
        });

        showMsg(result.customer_name + '님, 확인되었습니다.', 'info');
        renderMenu();
      } catch (err) {
        showMsg('연결 중 오류가 발생했습니다: ' + err.message, 'error');
        submitBtn.disabled = false;
      }
    });

    function renderMenu() {
      document.querySelector('.card-body').innerHTML = `
        <div style="text-align:center;">
          <p style="margin-bottom:20px;color:#555;">이용하실 메뉴를 선택해주세요.</p>
          <button style="margin-bottom:12px;" onclick="location.href='/upload/'">📤 자료제출함</button>
          <button style="background:#555;" onclick="location.href='/report/'">📄 보고서함</button>
        </div>
      `;
    }

    // 이미 로그인 세션이 있으면 바로 메뉴 표시
    (function initFromSession() {
      const s = loadSession();
      if (s && s.report_id && s.password_hash) {
        renderMenu();
      }
    })();
  </script>
</body>
</html>
